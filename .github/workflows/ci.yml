name: CI

# CI próprio do ai-toolkit (infra/tooling): valida que a fonte neutra
# tipa e que o sync roda. As regras/skills geradas vão pros repos de
# produto via distribute.ts, não por este workflow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # Opt-in ao runtime Node 24 (silencia o aviso de deprecação do Node 20 nos actions JS)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  typecheck:
    name: Lint, typecheck, test & sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm sync
