name: CI

# CI próprio do ai-toolkit (infra/tooling): valida que a fonte neutra
# tipa e que o sync roda. As regras/skills geradas vão pros repos de
# produto via distribute.ts, não por este workflow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck & sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm sync
